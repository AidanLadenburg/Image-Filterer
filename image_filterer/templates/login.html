<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Image Filterer</title>
<style>
  :root {
    --bg: #0e0f12; --panel: #16181e; --border: #262a33; --text: #e6e8ee;
    --text-dim: #9aa0ad; --accent: #78aaff; --bad: #e0607a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  form { width: 300px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  label { font-size: 12px; color: var(--text-dim); }
  input { font: inherit; color: var(--text); background: #14161c; border: 1px solid var(--border);
    border-radius: 7px; padding: 8px 10px; outline: none; width: 100%; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(120,170,255,.15); }
  button { font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: #0e0f12;
    border: none; border-radius: 7px; padding: 9px 12px; }
  button:disabled { opacity: .6; cursor: default; }
  #error { font-size: 12px; color: var(--bad); min-height: 14px; }
</style>
</head>
<body>
<form id="login-form">
  <h1>Image Filterer</h1>
  <div>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus />
  </div>
  <div>
    <label for="name">Your name <span style="opacity:.7">(shown on stars you make)</span></label>
    <input id="name" type="text" maxlength="40" autocomplete="name" />
  </div>
  <div id="error"></div>
  <button id="submit" type="submit">Enter</button>
</form>
<script>
  // Same per-browser viewer id scheme the app itself uses, so the name
  // entered here attaches to the id that already owns this browser's stars.
  let viewer = null;
  try {
    viewer = localStorage.getItem("viewerId");
    if (!viewer) {
      viewer = "v" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      localStorage.setItem("viewerId", viewer);
    }
  } catch (e) {}
  try {
    const savedName = localStorage.getItem("displayName");
    if (savedName) document.getElementById("name").value = savedName;
  } catch (e) {}

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submit");
    const err = document.getElementById("error");
    const password = document.getElementById("password").value;
    const name = document.getElementById("name").value.trim();
    btn.disabled = true; err.textContent = "";
    try {
      const res = await fetch("/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password, viewer, name }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        try { if (name) localStorage.setItem("displayName", name); } catch (e) {}
        location.reload();
      } else {
        err.textContent = data.error || "Wrong password.";
      }
    } catch (e) {
      err.textContent = "Couldn't reach the server.";
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
