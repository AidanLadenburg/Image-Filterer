services:
  image-filterer:
    image: image-filterer:spark
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.spark
      args:
        SPARK_BASE_IMAGE: ${SPARK_BASE_IMAGE:-nvcr.io/nvidia/pytorch:25.11-py3}
    user: "${SPARK_UID:-1000}:${SPARK_GID:-1000}"
    init: true
    restart: unless-stopped
    ports:
      - "${SPARK_BIND_IP:-0.0.0.0}:${SPARK_PORT:-8600}:8600"
    environment:
      IMAGE_FILTERER_PASSWORD: ${IMAGE_FILTERER_PASSWORD:-}
      # Server-side export is enabled only when EXPORT_PATH is set.
      IMAGE_FILTERER_EXPORT_DIR: ${EXPORT_PATH:+/exports}
      # Optional: Slack/Teams incoming webhook for problem alerts.
      IMAGE_FILTERER_ALERT_WEBHOOK: ${IMAGE_FILTERER_ALERT_WEBHOOK:-}
      IMAGE_FILTERER_OCR_WORKERS: ${IMAGE_FILTERER_OCR_WORKERS:-4}
      IMAGE_FILTERER_MEM_CACHE_MB: ${IMAGE_FILTERER_MEM_CACHE_MB:-1024}
    volumes:
      - type: bind
        source: ${SPARK_DATA_DIR:?Set SPARK_DATA_DIR in .env.spark}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${PHOTO_SOURCE_PATH:-./deploy/spark/empty-photo-source}
        target: /photos
        read_only: true
        bind:
          create_host_path: false
      # Writable, unlike /photos: picks exported from the viewer land here
      # (e.g. an exports/ folder on the same LucidLink share).
      - type: bind
        source: ${EXPORT_PATH:-./deploy/spark/empty-export}
        target: /exports
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 1gb
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://127.0.0.1:8600/', context=ssl._create_unverified_context(), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
