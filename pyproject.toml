[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-filterer"
version = "1.0.0"
description = "Hero-shot selection and browsing for event photography"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "flask>=3.0",
    "opencv-python>=4.9",       # YuNet face detection
    "open_clip_torch>=3.3",    # SigLIP2 context encoder + FaRL backbone (tested 3.3)
    "transformers>=4.40",       # tokenizer used by the default SigLIP2 encoder
    "mediapipe>=0.10",          # eyelid / mouth landmarks
    "ultralytics>=8.4.155",         # YOLO11x-pose: people, keypoints (fp16 needs quantize=, 8.4.155+)
    "tqdm>=4.65",
    "rawpy>=0.18",              # RAW (CR3/ARW/NEF…) via the embedded JPEG preview
    "pyexiv2>=2.8",             # EXIF that PIL won't surface: RAW timestamps, Sony lens model
    "psutil>=5.9",              # health alerts (low memory)
]

[project.optional-dependencies]
# Compatibility extra retained for existing install commands; transformers is now required.
encoders = []
# Text on screen (OCR) for search and auto-export: PP-OCR (v3 detector, v4
# recognizer) on TensorRT with a CUDA 13 GPU, else RapidOCR's torch engine.
# Without these the app runs normally and says OCR is unavailable.
ocr = [
    "rapidocr>=3.9,<3.10",      # ocr.py patches its TensorRT engine builder; re-check before bumping
    "onnxruntime>=1.18",        # rapidocr imports it even when TensorRT does the work
    "tensorrt-cu13>=10",
    "cuda-python>=13",
    "rapidfuzz>=3",             # typo-tolerant matching of the text read
]
dev = ["pytest>=7.4"]

[project.scripts]
image-filterer-server = "image_filterer.server:main"
image-filterer-train = "image_filterer.train:main"

[tool.setuptools.packages.find]
include = ["image_filterer*"]

[tool.setuptools.package-data]
image_filterer = ["templates/*.html", "model/*.pt", "model/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
